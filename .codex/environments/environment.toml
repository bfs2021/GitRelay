version = 1
name = "GitRelay"

[setup]
script = ""

[[actions]]
name = "Branch status"
icon = "run"
command = "node --experimental-strip-types src/cli/main.ts status --github --format markdown --output .codex/git-relay-status.md"

[[actions]]
name = "Monitor branches (read-only)"
icon = "run"
command = "node --experimental-strip-types src/cli/main.ts status --github --watch --no-auto-sync --format markdown"

[[actions]]
name = "Auto-sync (fast-forward)"
icon = "run"
command = "node --experimental-strip-types src/cli/main.ts status --github --watch --auto-sync --format markdown"
